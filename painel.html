  --f-display: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --f-texto: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-assinatura: "Great Vibes", "Snell Roundhand", "Segoe Script", cursive;

  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --max: 1240px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }

.btn {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 15px 26px; font-size: 12px; font-weight: 500;
  letter-spacing: .2em; text-transform: uppercase;
  border: 1px solid var(--ouro); transition: background .35s, color .35s, border-color .35s;
  position: relative; will-change: transform;
}
.btn svg { width: 14px; height: 14px; transition: transform .35s; }
.btn:hover svg { transform: translateX(4px); }
.btn-ouro { background: var(--ouro); color: var(--noite); }
.btn-ouro:hover { background: var(--ouro-claro); border-color: var(--ouro-claro); }
.btn-linha { color: var(--branco); border-color: rgba(246, 241, 232, .55); }
.btn-linha:hover { border-color: var(--ouro-claro); color: var(--ouro-claro); }
.logo { display: block; flex: none; border-radius: 50%; background: var(--logo) center / cover no-repeat; }
/* ---------- área da loja (painel) ---------- */
.area-admin { margin-top: 14px; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; }
.area-admin a { color: var(--ouro-claro); display: inline-flex; align-items: center; gap: 8px; }
.area-admin a:hover { color: var(--branco); }
.area-admin svg { width: 14px; height: 14px; }
body.modo-painel { overflow: hidden; }
.painel { position: fixed; inset: 0; z-index: 90; background: var(--noite); color: var(--branco); display: flex; flex-direction: column; --px: max(16px, calc((100% - 940px) / 2)); }
.painel.travado .p-abas, .painel.travado .p-corpo, .painel.travado .p-pe, .painel.travado #pSair { display: none; }
.painel:not(.travado) .p-login { display: none; }
.p-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px var(--px); padding-top: max(14px, env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--linha-escura); background: var(--veludo); }
.p-marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
.p-marca .logo { width: 42px; height: 42px; }
.p-marca b { display: block; font-weight: 400; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; }
.p-estado { display: block; font-size: 12px; color: var(--nevoa); }
.p-estado.aviso-salvar { color: var(--ouro-claro); }
.p-acoes-topo { display: flex; gap: 8px; flex: none; }
.p-bt { font: 400 11px/1 var(--f-texto); letter-spacing: .16em; text-transform: uppercase; color: var(--branco); background: transparent; border: 1px solid rgba(246, 241, 232, .3); padding: 10px 14px; cursor: pointer; white-space: nowrap; }
.p-bt:hover { border-color: var(--ouro); color: var(--ouro-claro); }
.p-login { flex: 1; overflow: auto; display: grid; place-items: center; padding: 32px 16px; background: radial-gradient(circle at 50% 0%, #2a2414 0, var(--noite) 60%); }
.p-login form { width: min(380px, 100%); background: var(--veludo); border: 1px solid var(--linha-escura); padding: 30px 24px; display: grid; gap: 16px; }
.p-login .logo { width: 96px; height: 96px; margin: 0 auto 4px; }
.p-login h2 { text-align: center; font-family: var(--f-assinatura); font-weight: 400; font-size: 44px; line-height: 1; color: var(--ouro); text-transform: none; letter-spacing: 0; }
.p-login p { margin: 0; color: var(--nevoa); font-size: 14px; text-align: center; }
.p-login .erro { color: #ff8a7a; }
.p-abas { display: flex; gap: 6px; padding: 16px var(--px) 0; }
.p-aba { flex: 0 1 200px; font: 400 11px/1 var(--f-texto); letter-spacing: .2em; text-transform: uppercase; color: var(--nevoa); background: transparent; border: 1px solid var(--linha-escura); padding: 12px; cursor: pointer; }
.p-aba[aria-selected="true"] { background: var(--ouro); border-color: var(--ouro); color: var(--noite); }
.p-corpo { flex: 1; overflow: auto; padding: 18px var(--px); display: grid; align-content: start; gap: 16px; }
.p-pe { border-top: 1px solid var(--linha-escura); background: var(--veludo); padding: 14px var(--px); padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.p-msg { font-size: 13px; color: var(--nevoa); }
.p-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.p-lista li { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; background: var(--veludo); border: 1px solid var(--linha-escura); padding: 10px; }
.p-mini { position: relative; width: 56px; height: 70px; overflow: hidden; background: var(--veludo-2); }
.p-mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.p-mini.grande { width: 120px; height: 150px; }
.p-info { min-width: 0; }
.p-info b { display: block; font-weight: 400; font-size: 15px; line-height: 1.3; }
.p-info small { color: var(--nevoa); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.p-botoes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.p-botoes button, .p-voltar { font: 400 12px/1 var(--f-texto); color: var(--branco); background: transparent; border: 1px solid rgba(246, 241, 232, .22); padding: 9px 12px; cursor: pointer; }
.p-botoes button:hover, .p-voltar:hover { border-color: var(--ouro); color: var(--ouro-claro); }
.p-botoes button:disabled { opacity: .3; cursor: default; }
.p-botoes button.perigo { background: #a8321f; border-color: #a8321f; color: #fff; }
.p-voltar { justify-self: start; }
.p-foto { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.p-foto small { display: block; font-size: 12.5px; color: var(--nevoa); margin-top: 10px; max-width: 30ch; }
.p-enviar { display: inline-flex; cursor: pointer; }
.campo { display: grid; gap: 6px; min-width: 0; }
.campo span { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ouro-claro); }
.campo small { font-size: 12.5px; color: var(--nevoa); }
.campo input, .campo select, .campo textarea { width: 100%; font: 400 15px var(--f-texto); color: var(--branco); background: #100f0e; border: 1px solid rgba(242, 223, 87, .28); border-radius: 0; padding: 12px; }
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--ouro); box-shadow: 0 0 0 1px var(--ouro); }
.p-grupo { border: 1px solid var(--linha-escura); padding: 14px 16px 16px; display: grid; gap: 14px; margin: 0; min-width: 0; }
.p-grupo legend { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; padding: 0 8px; color: var(--branco); }
.p-grupo > small { font-size: 13px; color: var(--nevoa); }
.p-linha { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.p-pe .btn { justify-content: center; }
@media (max-width: 520px) {
  .p-linha { grid-template-columns: 1fr; }
  .p-marca b { font-size: 11px; letter-spacing: .14em; }
  .p-acoes-topo .p-bt { padding: 9px 10px; letter-spacing: .08em; }
}

</style>
<style>
/* Ajustes só do painel (página própria, fora do site) */
body { margin: 0; background: var(--noite); color: var(--branco); font-family: var(--f-texto); font-weight: 300; }
button, input, select, textarea { font-family: inherit; }
.painel { position: static; min-height: 100vh; min-height: 100dvh; }
.p-corpo { overflow: visible; }
.p-pe { position: sticky; bottom: 0; }
.p-acoes-topo a.p-bt { text-decoration: none; display: inline-flex; align-items: center; }
.p-aviso { background: #2a2414; border: 1px solid var(--ouro-escuro); padding: 12px 14px; font-size: 14px; color: var(--linho); text-align: left; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ouro); color: var(--noite); padding: 12px 18px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; z-index: 100; }
</style>
</head>
<body>
<section class="painel travado" id="painel" aria-label="Área da loja">
  <div class="p-topo">
    <div class="p-marca"><span class="logo" role="img" aria-label="Logo Metal Nobre"></span><div><b>Área da loja</b><span class="p-estado" id="pEstado">Entre para editar</span></div></div>
    <div class="p-acoes-topo"><button class="p-bt" id="pSair" type="button">Sair</button><a class="p-bt" href="/" target="_blank" rel="noopener">Ver o site</a></div>
  </div>
  <div class="p-login" id="pLogin"></div>
  <div class="p-abas" role="tablist">
    <button class="p-aba" id="abaPecas" role="tab" aria-selected="true" type="button">Peças</button>
    <button class="p-aba" id="abaConfig" role="tab" aria-selected="false" type="button">Configurações</button>
  </div>
  <div class="p-corpo" id="pCorpo"></div>
  <div class="p-pe">
    <button class="btn btn-ouro" id="pSalvar" type="button">Salvar no site</button>
    <span class="p-msg" id="pMsg">Depois de salvar, o site atualiza sozinho em cerca de 1 minuto.</span>
  </div>
</section>
<div class="toast" id="toast" hidden></div>
<script>
// Área da loja na Vercel: login e gravação passam pelas rotas /api, que salvam no GitHub.
var D = null, sha = null, mudou = false, salvando = false;
var aba = 'pecas', editando = null, confirmaExcluir = null;
var previas = {}; // fotos recém-enviadas, mostradas antes de o site publicar de novo
var $ = function (id) { return document.getElementById(id); };
var corpo = $('pCorpo');
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var digitos = function (s) { return String(s || '').replace(/\D/g, ''); };
var fonte = function (src) { return previas[src] || '/' + String(src).replace(/^\//, ''); };
var tt; function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(function () { el.hidden = true; }, 2200); }

async function api(rota, corpoReq) {
  var r = await fetch('/api/' + rota, corpoReq === undefined ? { credentials: 'same-origin' } : { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpoReq) });
  var j = await r.json().catch(function () { return {}; });
  if (r.status === 401 && j.erro === 'sessao') { travar('Sua sessão terminou. Entre de novo.'); throw j; }
  if (!r.ok) throw Object.assign(j, { status: r.status });
  return j;
}
var ERROS = {
  conflito: 'O conteúdo mudou desde que você abriu a Área da loja. Atualize a página e faça a mudança de novo.',
  token: 'A Área da loja não tem permissão para gravar no GitHub. Confira o GITHUB_TOKEN na Vercel.',
  token_invalido: 'A senha está certa, mas o GITHUB_TOKEN da Vercel não é válido. Gere um token novo, cole na Vercel e faça Redeploy.',
  token_sem_repo: 'A senha está certa, mas o GITHUB_TOKEN não tem acesso ao repositório Metal-Nobre. No token, marque o Metal-Nobre e a permissão Contents em Read and write.',
  github: 'O GitHub não respondeu agora. Tente de novo em instantes.',
  grande: 'A foto ficou grande demais. Tente outra foto.'
};
var msgErro = function (e) { return ERROS[e && e.erro] || 'Não deu para salvar agora. Tente de novo em instantes.'; };

/* ---------- Login ---------- */
function travar(msg) {
  $('painel').classList.add('travado'); $('pEstado').textContent = 'Entre para editar';
  $('pLogin').innerHTML = '<form id="lgForm">' +
    '<span class="logo" role="img" aria-label="Logo Metal Nobre"></span>' +
    '<h2>Entrar</h2><p>Digite seu usuário e senha para mexer no site.</p>' +
    '<label class="campo"><span>Usuário</span><input id="lgUser" autocomplete="username" autocapitalize="none"></label>' +
    '<label class="campo"><span>Senha</span><input id="lgSenha" type="password" autocomplete="current-password"></label>' +
    '<button class="btn btn-ouro" id="lgOk" type="submit" style="justify-content:center">Entrar</button>' +
    '<p id="lgMsg" class="' + (msg ? 'erro' : '') + '">' + (msg ? esc(msg) : '') + '</p></form>';
  $('lgForm').onsubmit = entrar;
  setTimeout(function () { $('lgUser').focus(); }, 0);
}
function semConfig(falta) {
  $('painel').classList.add('travado');
  $('pLogin').innerHTML = '<form><span class="logo" role="img" aria-label="Logo Metal Nobre"></span><h2>Falta configurar</h2>' +
    '<p class="p-aviso">Cadastre na Vercel (Settings → Environment Variables) estes itens e publique de novo: <b>' + falta.map(esc).join(', ') + '</b>.</p></form>';
}
async function entrar(e) {
  e.preventDefault();
  var erro = function (t) { $('lgMsg').textContent = t; $('lgMsg').className = 'erro'; };
  var usuario = $('lgUser').value.trim(), senha = $('lgSenha').value;
  if (!usuario || !senha) return erro('Preencha usuário e senha.');
  $('lgOk').disabled = true; $('lgMsg').className = ''; $('lgMsg').textContent = 'Entrando…';
  try { await api('login', { usuario: usuario, senha: senha }); }
  catch (j) {
    erro(j.erro === 'senha' ? 'Usuário ou senha incorretos.' : j.erro === 'config' ? 'A Área da loja ainda não foi configurada na Vercel.' : 'Não deu para entrar agora (erro ' + (j.status || 'de conexão') + '). Tente de novo.');
    var b0 = $('lgOk'); if (b0) b0.disabled = false; return;
  }
  // a senha está certa; agora o painel lê as peças no GitHub
  try { await abrir(); }
  catch (j) { erro(ERROS[j.erro] || 'A senha está certa, mas não deu para ler as peças no GitHub (erro ' + (j.status || 'de conexão') + ').'); }
  finally { var b = $('lgOk'); if (b) b.disabled = false; }
}
async function abrir() {
  var j = await api('dados');
  D = j.dados; sha = j.sha; D.pecas = D.pecas || []; D.loja = D.loja || {};
  $('painel').classList.remove('travado'); marcar(false); renderPainel();
}
$('pSair').onclick = async function () {
  if (mudou && !confirm('Você tem mudanças não salvas. Sair mesmo assim?')) return;
  await fetch('/api/sair', { method: 'POST' }).catch(function () {}); marcar(false); D = null; editando = null; aba = 'pecas'; travar();
};

/* ---------- Edição ---------- */
function marcar(v) { mudou = v; $('pEstado').textContent = v ? 'Alterações não salvas' : 'Tudo salvo'; $('pEstado').classList.toggle('aviso-salvar', v); }
function campo(id, rotulo, valor, op) {
  op = op || {};
  return '<label class="campo"><span>' + rotulo + '</span><input id="' + id + '" type="text" value="' + esc(valor) + '"' + (op.ph ? ' placeholder="' + esc(op.ph) + '"' : '') + '>' + (op.dica ? '<small>' + op.dica + '</small>' : '') + '</label>';
}
function renderPainel() {
  $('abaPecas').setAttribute('aria-selected', aba === 'pecas');
  $('abaConfig').setAttribute('aria-selected', aba === 'config');
  if (aba === 'config') return renderConfig();
  if (editando) return renderPeca();
  corpo.innerHTML = '<button class="btn btn-ouro" id="pNova" type="button" style="justify-self:start">+ Nova peça</button>' +
    '<ul class="p-lista">' + D.pecas.map(function (p, i) {
      return '<li><div class="p-mini">' + (p.img ? '<img src="' + esc(fonte(p.img)) + '" alt="">' : '') + '</div>' +
        '<div class="p-info"><b>' + esc(p.nome) + '</b><small>' + esc(p.cat) + '</small></div>' +
        '<div class="p-botoes">' +
        '<button type="button" data-acao="subir" data-i="' + i + '" aria-label="Subir" ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
        '<button type="button" data-acao="descer" data-i="' + i + '" aria-label="Descer" ' + (i === D.pecas.length - 1 ? 'disabled' : '') + '>↓</button>' +
        '<button type="button" data-acao="editar" data-i="' + i + '">Editar</button>' +
        '<button type="button" data-acao="excluir" data-i="' + i + '" class="' + (confirmaExcluir === i ? 'perigo' : '') + '">' + (confirmaExcluir === i ? 'Confirmar exclusão' : 'Excluir') + '</button>' +
        '</div></li>';
    }).join('') + '</ul>';
}
function renderPeca() {
  var p = editando;
  var lista = (D.categorias || []).slice(); if (p.cat && lista.indexOf(p.cat) < 0) lista.push(p.cat);
  corpo.innerHTML = '<button class="p-voltar" id="pVoltar" type="button">← Voltar para a lista</button>' +
    '<div class="p-foto"><div class="p-mini grande">' + (p.img ? '<img src="' + esc(fonte(p.img)) + '" alt="">' : '') + '</div>' +
    '<div><label class="btn btn-linha p-enviar">' + (p.img ? 'Trocar foto' : 'Escolher foto') + '<input type="file" id="pArquivo" accept="image/jpeg,image/png,image/webp" hidden></label>' +
    '<small id="pFotoMsg">Foto em pé (vertical) fica melhor.</small></div></div>' +
    campo('fNome', 'Nome da peça', p.nome) +
    '<label class="campo"><span>Categoria</span><select id="fCat">' + lista.map(function (c) { return '<option' + (c === p.cat ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select><small>Para criar outra categoria, vá em Configurações.</small></label>';
}
function renderConfig() {
  corpo.innerHTML = '<fieldset class="p-grupo"><legend>WhatsApp</legend>' +
    campo('cZap', 'Número que recebe os pedidos', D.loja.whatsapp, { ph: '5562984307480', dica: 'Use 55 + DDD + número, só os dígitos.' }) + '</fieldset>' +
    '<fieldset class="p-grupo"><legend>Categorias</legend>' +
    campo('cCats', 'Categorias, na ordem dos filtros', (D.categorias || []).join(', '), { dica: 'Separe por vírgula. Ex.: Colar, Pulseira, Brinco, Anel, Aliança' }) + '</fieldset>' +
    '<fieldset class="p-grupo"><legend>Usuário e senha</legend><small>Para trocar, mude ADMIN_USER e ADMIN_PASSWORD na Vercel (Settings → Environment Variables) e publique de novo.</small></fieldset>';
}
corpo.addEventListener('input', function (e) {
  var t = e.target;
  if (aba === 'pecas' && editando) {
    if (t.id === 'fNome') { editando.nome = t.value; marcar(true); }
    return;
  }
  if (aba === 'config') {
    if (t.id === 'cZap') D.loja.whatsapp = digitos(t.value);
    if (t.id === 'cCats') D.categorias = t.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    marcar(true);
  }
});

// Reduz a foto no navegador (até 1600 px, JPEG) para caber no envio.
function reduzir(arquivo) {
  return new Promise(function (ok, falha) {
    var img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? ok(b) : falha(new Error('canvas')); }, 'image/jpeg', 0.86);
    };
    img.onerror = function () { URL.revokeObjectURL(url); falha(new Error('imagem')); };
    img.src = url;
  });
}
var paraBase64 = function (blob) { return new Promise(function (ok) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(',')[1]); }; r.readAsDataURL(blob); }); };
corpo.addEventListener('change', async function (e) {
  if (e.target.id === 'fCat' && editando) { editando.cat = e.target.value; marcar(true); return; }
  if (e.target.id !== 'pArquivo' || !e.target.files[0] || !editando) return;
  var alvo = editando;
  $('pFotoMsg').textContent = 'Enviando foto…';
  try {
    var blob = await reduzir(e.target.files[0]);
    var j = await api('foto', { tipo: 'image/jpeg', base64: await paraBase64(blob) });
    previas[j.caminho] = URL.createObjectURL(blob);
    alvo.img = j.caminho; alvo.pos = ''; marcar(true);
    if (editando === alvo) { renderPeca(); $('pFotoMsg').textContent = 'Foto enviada. Toque em Salvar no site para usar.'; }
  } catch (j) {
    if ($('pFotoMsg')) $('pFotoMsg').textContent = j && j.erro ? msgErro(j) : 'Não deu para abrir essa foto. Use JPG, PNG ou WEBP.';
  }
});
corpo.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.id === 'pNova') {
    editando = { id: 'p' + Date.now().toString(36), nome: 'Nova peça', cat: (D.categorias || [])[0] || '', img: '', pos: '' };
    D.pecas.unshift(editando); marcar(true); renderPainel(); return;
  }
  if (b.id === 'pVoltar') { editando = null; renderPainel(); return; }
  var i = +b.dataset.i, acao = b.dataset.acao; if (!acao) return;
  if (acao === 'editar') { editando = D.pecas[i]; confirmaExcluir = null; renderPainel(); window.scrollTo(0, 0); return; }
  if (acao === 'subir' || acao === 'descer') {
    var j = acao === 'subir' ? i - 1 : i + 1, x = D.pecas[i]; D.pecas[i] = D.pecas[j]; D.pecas[j] = x;
    confirmaExcluir = null; marcar(true); renderPainel(); return;
  }
  if (acao === 'excluir') {
    if (confirmaExcluir === i) { D.pecas.splice(i, 1); confirmaExcluir = null; marcar(true); } else confirmaExcluir = i;
    renderPainel();
  }
});
$('abaPecas').onclick = function () { aba = 'pecas'; renderPainel(); };
$('abaConfig').onclick = function () { aba = 'config'; editando = null; renderPainel(); };
$('pSalvar').onclick = async function () {
  if (salvando || !D) return;
  salvando = true; $('pSalvar').disabled = true; $('pMsg').textContent = 'Salvando…';
  try {
    var j = await api('dados', { dados: D, sha: sha });
    sha = j.sha; marcar(false);
    $('pMsg').textContent = 'Salvo! O site atualiza sozinho em cerca de 1 minuto.';
    toast('Site salvo');
  } catch (j) {
    $('pMsg').textContent = msgErro(j);
  } finally {
    salvando = false; $('pSalvar').disabled = false;
  }
};
window.addEventListener('beforeunload', function (e) { if (mudou) { e.preventDefault(); e.returnValue = ''; } });

fetch('/api/sessao', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
  if (s.falta && s.falta.length) return semConfig(s.falta);
  if (s.logado) return abrir().catch(function () { travar(); });
  travar();
}).catch(function () { semConfig(['as rotas /api não responderam']); });
</script>
</body>
</html>
